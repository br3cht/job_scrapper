<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Scraper — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [x-cloak] { display: none; }
    .line-clamp-3 {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="max-w-7xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">💼 Job Scraper</h1>
        <p class="text-sm text-slate-500">Dashboard de vagas remotas</p>
      </div>
      <div class="flex gap-2">
        <button id="btn-send" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium transition">
          ✈️ Enviar p/ Telegram
        </button>
        <button id="btn-open-scrape" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition">
          🔍 Nova busca
        </button>
      </div>
    </header>

    <!-- Stats cards -->
    <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6"></section>

    <!-- By source -->
    <section class="bg-white rounded-xl shadow-sm p-4 mb-6">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-3">Vagas por fonte</h2>
      <div id="by-source" class="space-y-2"></div>
    </section>

    <!-- Filters -->
    <section class="bg-white rounded-xl shadow-sm p-4 mb-4">
      <div class="flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[200px]">
          <label class="block text-xs font-medium text-slate-500 mb-1">Buscar (título, empresa, descrição)</label>
          <input id="f-q" type="text" placeholder="ex: python, laravel..."
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Fonte</label>
          <select id="f-source" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="">Todas</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Status</label>
          <select id="f-sent" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="">Todas</option>
            <option value="false">Não enviadas</option>
            <option value="true">Enviadas</option>
          </select>
        </div>
        <button id="btn-apply" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium transition">
          Filtrar
        </button>
      </div>
    </section>

    <!-- Jobs list -->
    <section id="jobs" class="space-y-3"></section>
    <p id="jobs-empty" class="hidden text-center text-slate-400 py-10">Nenhuma vaga encontrada.</p>
  </div>

  <!-- Scrape modal -->
  <div id="scrape-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <h2 class="text-lg font-bold mb-4">Nova busca de vagas</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Termo de busca *</label>
          <input id="s-query" type="text" placeholder="ex: python developer"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-2">Sites</label>
          <div id="s-sites" class="grid grid-cols-2 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Região Indeed</label>
          <select id="s-region" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <option value="br">Brasil</option>
            <option value="world">Mundo</option>
          </select>
        </div>
      </div>
      <div id="s-status" class="hidden mt-4 text-sm rounded-lg px-3 py-2"></div>
      <div class="flex justify-end gap-2 mt-6">
        <button id="btn-close-scrape" class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-sm font-medium">Fechar</button>
        <button id="btn-start-scrape" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">Iniciar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg text-white text-sm z-50"></div>

  <script>
    const $ = (s) => document.querySelector(s);
    let pollTimer = null;

    function toast(msg, ok = true) {
      const t = $("#toast");
      t.textContent = msg;
      t.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg shadow-lg text-white text-sm z-50 ${ok ? "bg-emerald-600" : "bg-red-600"}`;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 3500);
    }

    function esc(s) {
      return (s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) {
        let detail = res.statusText;
        try { detail = (await res.json()).detail || detail; } catch (e) {}
        throw new Error(detail);
      }
      return res.status === 204 ? null : res.json();
    }

    const statCard = (label, value, color) =>
      `<div class="bg-white rounded-xl shadow-sm p-4">
        <p class="text-xs font-medium text-slate-500 uppercase tracking-wide">${label}</p>
        <p class="text-3xl font-bold ${color} mt-1">${value}</p>
      </div>`;

    async function loadStats() {
      const s = await api("/api/stats");
      $("#stats").innerHTML =
        statCard("Total", s.total, "text-slate-900") +
        statCard("Enviadas", s.sent, "text-sky-600") +
        statCard("Não enviadas", s.unsent, "text-amber-600") +
        statCard("Fontes", s.by_source.length, "text-emerald-600");

      const max = Math.max(1, ...s.by_source.map((x) => x.count));
      $("#by-source").innerHTML = s.by_source.length
        ? s.by_source.map((x) =>
            `<div class="flex items-center gap-3">
              <span class="w-32 text-sm text-slate-600 shrink-0">${esc(x.source)}</span>
              <div class="flex-1 bg-slate-100 rounded-full h-5 overflow-hidden">
                <div class="bg-emerald-500 h-5 rounded-full" style="width:${(x.count / max) * 100}%"></div>
              </div>
              <span class="text-sm font-medium text-slate-700 w-10 text-right">${x.count}</span>
            </div>`).join("")
        : '<p class="text-sm text-slate-400">Sem dados ainda.</p>';
    }

    async function loadSources() {
      const sources = await api("/api/sources");
      const sel = $("#f-source");
      sel.innerHTML = '<option value="">Todas</option>' +
        sources.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    }

    const badge = (txt, cls) => `<span class="inline-block text-xs px-2 py-0.5 rounded-full ${cls}">${esc(txt)}</span>`;

    function jobCard(j) {
      const sentBadge = j.sent_to_telegram
        ? badge("✓ enviada", "bg-sky-100 text-sky-700")
        : badge("pendente", "bg-amber-100 text-amber-700");
      const meta = [j.location, j.salary, j.job_type, j.posted_date].filter(Boolean).map((m) => esc(m)).join(" · ");
      return `<div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex justify-between items-start gap-3">
          <div class="min-w-0">
            <a href="${esc(j.url)}" target="_blank" rel="noopener"
               class="font-semibold text-slate-900 hover:text-emerald-600 break-words">${esc(j.title)}</a>
            <p class="text-sm text-slate-600">${esc(j.company)}</p>
          </div>
          <div class="flex flex-col items-end gap-1 shrink-0">
            ${badge(j.source, "bg-slate-100 text-slate-600")}
            ${sentBadge}
          </div>
        </div>
        ${meta ? `<p class="text-xs text-slate-500 mt-2">${meta}</p>` : ""}
        ${j.description ? `<p class="text-sm text-slate-500 mt-2 line-clamp-3">${esc(j.description.slice(0, 400))}</p>` : ""}
        <div class="flex justify-between items-center mt-3">
          <a href="${esc(j.url)}" target="_blank" rel="noopener" class="text-sm text-emerald-600 hover:underline">Ver vaga →</a>
          <button data-id="${j.id}" class="btn-del text-xs text-red-500 hover:text-red-700">Excluir</button>
        </div>
      </div>`;
    }

    async function loadJobs() {
      const params = new URLSearchParams();
      const q = $("#f-q").value.trim();
      const source = $("#f-source").value;
      const sent = $("#f-sent").value;
      if (q) params.set("q", q);
      if (source) params.set("source", source);
      if (sent) params.set("sent", sent);
      const jobs = await api("/api/jobs?" + params.toString());
      $("#jobs").innerHTML = jobs.map(jobCard).join("");
      $("#jobs-empty").classList.toggle("hidden", jobs.length > 0);
      document.querySelectorAll(".btn-del").forEach((b) =>
        b.addEventListener("click", () => deleteJob(b.dataset.id)));
    }

    async function deleteJob(id) {
      if (!confirm("Excluir esta vaga?")) return;
      try {
        await api(`/api/jobs/${id}`, { method: "DELETE" });
        toast("Vaga excluída.");
        await Promise.all([loadJobs(), loadStats()]);
      } catch (e) { toast(e.message, false); }
    }

    async function refreshAll() {
      await Promise.all([loadStats(), loadSources(), loadJobs()]);
    }

    // Scrape modal
    async function openScrape() {
      const cfg = await api("/api/config");
      $("#s-sites").innerHTML = cfg.sites.map((s) =>
        `<label class="flex items-center gap-2 text-sm">
          <input type="checkbox" class="s-site rounded" value="${esc(s)}" checked /> ${esc(s)}
        </label>`).join("");
      $("#scrape-modal").classList.remove("hidden");
      pollStatus();
    }

    function closeScrape() {
      $("#scrape-modal").classList.add("hidden");
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function showScrapeStatus(st) {
      const el = $("#s-status");
      el.classList.remove("hidden");
      const color = st.error ? "bg-red-50 text-red-700"
        : st.running ? "bg-amber-50 text-amber-700"
        : "bg-emerald-50 text-emerald-700";
      el.className = `mt-4 text-sm rounded-lg px-3 py-2 ${color}`;
      el.textContent = st.error ? `Erro: ${st.error}` : st.message;
    }

    function pollStatus() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const st = await api("/api/scrape/status");
          showScrapeStatus(st);
          if (!st.running) {
            clearInterval(pollTimer); pollTimer = null;
            if (st.started_at) { await refreshAll(); }
          }
        } catch (e) {}
      }, 1500);
    }

    async function startScrape() {
      const query = $("#s-query").value.trim();
      if (!query) { toast("Informe um termo de busca.", false); return; }
      const sites = [...document.querySelectorAll(".s-site:checked")].map((c) => c.value);
      try {
        await api("/api/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, sites: sites.length ? sites : null, indeed_region: $("#s-region").value }),
        });
        toast("Busca iniciada.");
        pollStatus();
      } catch (e) { toast(e.message, false); }
    }

    async function sendTelegram() {
      if (!confirm("Enviar todas as vagas não enviadas para o Telegram?")) return;
      const btn = $("#btn-send");
      btn.disabled = true; btn.textContent = "Enviando...";
      try {
        const r = await api("/api/send", { method: "POST" });
        toast(r.message);
        await refreshAll();
      } catch (e) { toast(e.message, false); }
      finally { btn.disabled = false; btn.textContent = "✈️ Enviar p/ Telegram"; }
    }

    // Wire up
    $("#btn-apply").addEventListener("click", loadJobs);
    $("#f-q").addEventListener("keydown", (e) => { if (e.key === "Enter") loadJobs(); });
    $("#btn-open-scrape").addEventListener("click", openScrape);
    $("#btn-close-scrape").addEventListener("click", closeScrape);
    $("#btn-start-scrape").addEventListener("click", startScrape);
    $("#btn-send").addEventListener("click", sendTelegram);

    refreshAll().catch((e) => toast("Erro ao carregar: " + e.message, false));
  </script>
</body>
</html>
